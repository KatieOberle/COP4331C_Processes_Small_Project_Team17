<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Manager</title>

    <link rel="stylesheet" href="css/styles.css">
</head>


<body>

    <nav class="navbar">

        <h2>
            Contact Manager
        </h2>

        <button onclick="logout()">
            Logout
        </button>

    </nav>


    <main class="dashboard">

        <div class="dashboard-header">

            <div>

                <h1>
                    My Contacts
                </h1>

                <p>
                    Search and manage your contacts
                </p>

            </div>

            <button class="add-button" onclick="addContact()">
                + Add Contact
            </button>

        </div>


        <div class="search-container">

            <input
                type="text"
                id="searchText"
                placeholder="Search contacts..."
            >

            <button onclick="searchContacts()">
                Search
            </button>

        </div>


        <!--
            Real contacts from the backend
            will be inserted here later.
        -->
        <div
            class="contact-list"
            id="contactList"
        >
        </div>

    </main>


    <script src="js/code.js"></script>

</body>

</html>
