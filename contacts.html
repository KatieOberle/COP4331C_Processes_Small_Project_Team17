<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Manager</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar">

        <h2>Contact Manager</h2>

        <button onclick="logout()">
            Logout
        </button>

    </nav>


    <main class="dashboard">

        <div class="dashboard-header">

            <div>
                <h1>My Contacts</h1>

                <p>
                    Search and manage your contacts
                </p>
            </div>

            <button
                class="add-button"
                onclick="showAddContactForm()"
            >
                + Add Contact
            </button>

        </div>


        <div class="search-container">

            <input
                type="text"
                id="searchText"
                placeholder="Search contacts..."
            >

            <button onclick="searchContacts()">
                Search
            </button>

        </div>


        <!-- ADD CONTACT FORM -->
        <div
            id="addContactForm"
            class="contact-form hidden"
        >

            <h2>Add Contact</h2>

            <div class="form-group">

                <label for="contactFirstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="contactFirstName"
                    placeholder="First name"
                >

            </div>


            <div class="form-group">

                <label for="contactLastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="contactLastName"
                    placeholder="Last name"
                >

            </div>


            <div class="form-group">

                <label for="contactPhone">
                    Phone
                </label>

                <input
                    type="text"
                    id="contactPhone"
                    placeholder="Phone number"
                >

            </div>


            <div class="form-group">

                <label for="contactEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="contactEmail"
                    placeholder="Email address"
                >

            </div>


            <div class="contact-form-buttons">

                <button onclick="addContact()">
                    Save Contact
                </button>

                <button onclick="hideAddContactForm()">
                    Cancel
                </button>

            </div>


            <p id="addContactResult"></p>

        </div>


        <!--
           contacts from the backend
            will be inserted here 
        -->
        <div
            class="contact-list"
            id="contactList"
        >
        </div>

    </main>


    <script src="js/code.js"></script>

</body>

</html>
