<!doctype html>
<html lang="en">
  <head>
    <!-- AI transparency: followed HTML template provided by Codex, modified accordingly to add features -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--width and scaling across different devices-->
    <title>Edit Contact | Contact Manager</title>
    <link rel="stylesheet" href="css/styles.css" /> <!-- Katie: changed directory to frontend theme -->
  </head>

  <body>
    <!--Katie: including class pages to interconnect frontend-->
    <header class="navbar">
      <!--Katie: switched template navigator to established navigator and return button to escape edit page-->
      <h2>Contact Manager</h2>
      <button onclick="window.location.href='contacts.html'">Return to Contacts</button> <!--return to contacts page-->
      </header>

      <main class="dashboard"> <!--Katie: included dash page centered instead of template main-->
        <div class="auth-card"> 
          <h1 id="edit_contact_title">Edit Contact: </h1>
          <!--Update contact info-->
          <form id="edit_contact_form" novalidate>
            <div class="form-group">
              <label id="first_name_label" for="first_name_interactive">First name</label> <!--Katie: implement working first name label-->
              <input
                id="first_name_interactive"
                name="firstName"
                type="text"
                value="First"
                autocomplete="given-name"
                required 
              />
              </div>

            <div class="form-group">
            <!--Katie: edit last name now compatible-->
              <label id="last_name_label" for="last_name_interactive">Last name</label>
              <input
                id="last_name_interactive"
                name="lastName"
                type="text"
                value="Last"
                autocomplete="family-name"
                required
              />
            </div>
            <!--Katie: connect phone number field-->
            <div class="form-group">
              <label id="phone_number_label" for="phone_number">Phone number</label>
              <!--Katie: tel instead of text-->
              <input
                id="phone_number"
                name="phoneNumber"
                type="tel" 
                value="000-000-0000"
                autocomplete="tel"
                placeholder="000-000-0000"
              />
            </div>

            <!--Katie: new email field entry-->
            <div class="form-group">
              <label id="email_label" for="email">Email address</label>
              <input
                id="email"
                name="Email"
                type="email"
                value="email@example.com"
                autocomplete="email"
                placeholder="name@example.com"
              />
            </div>

            <!--Katie: implement/edit last updated date from template-->
            <p class="last-updated">
              Last updated: <time id="last_updated" datetime="">Not saved yet</time>
            </p>

            <!--Katie: include save/cancel changes buttons-->
            <div class="button-row">
              <button id="save_changes_button" type="button">Save changes</button>
              <button id="cancel_changes_button" class="edit-button" type="button">Cancel</button>
            </div>
          </form>
        </div>
      </main>
    <!--Katie: debugging, forgot script source-->
    <script src="js/code.js"></script>
  </body>
</html>
