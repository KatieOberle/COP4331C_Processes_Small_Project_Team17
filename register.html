<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Manager - Register</title>

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


    <div class="auth-container">

        <div class="auth-card">

            <h1>
                Create Account 💗
            </h1>

            <p class="subtitle">
                Register to start managing your contacts
            </p>


            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="Enter first name"
                >

            </div>


            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Enter last name"
                >

            </div>


            <div class="form-group">

                <label for="registerLogin">
                    Username
                </label>

                <input
                    type="text"
                    id="registerLogin"
                    placeholder="Choose a username"
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Choose a password"
                >

            </div>


            <button onclick="doRegister()">
                Register
            </button>


            <p id="registerResult"></p>


            <p class="switch-page">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/code.js"></script>

</body>

</html>
